
name: Build Material Pin Thunderbird Addon

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pin-addon/requirements.txt ]; then
            pip install -r pin-addon/requirements.txt
          fi

      - name: Build Material Pin XPI
        run: |
          cd pin-addon
          python3 build.py

      - name: List build output
        run: |
          echo "Build output:"
          ls -lah pin-addon/dist/

      - name: Upload XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: material-pin-thunderbird-addon
          path: pin-addon/dist/*.xpi
          if-no-files-found: error
